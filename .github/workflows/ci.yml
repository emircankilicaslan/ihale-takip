name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      oracle:
        image: gvenzl/oracle-free:23-slim-faststart
        env:
          ORACLE_PASSWORD: ci-sys-sifresi
          APP_USER: ihale
          APP_USER_PASSWORD: ci-uygulama-sifresi
        ports:
          - 1521:1521
        options: >-
          --health-cmd healthcheck.sh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Derle ve test et (Oracle'a karşı)
        run: mvn -B verify
        env:
          DB_URL: jdbc:oracle:thin:@//localhost:1521/FREEPDB1
          DB_USER: ihale
          DB_PASSWORD: ci-uygulama-sifresi
