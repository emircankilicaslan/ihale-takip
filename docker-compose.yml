# Yerel geliştirme: Oracle Free + uygulama. Parolalar .env dosyasından gelir (README'ye bakın).
services:
  oracle:
    image: gvenzl/oracle-free:23-slim-faststart
    environment:
      ORACLE_PASSWORD: ${ORACLE_SYS_SIFRE:?ORACLE_SYS_SIFRE tanımlanmalı}
      APP_USER: ihale
      APP_USER_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanımlanmalı}
    ports:
      - "1521:1521"
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30

  uygulama:
    build: .
    depends_on:
      oracle:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:oracle:thin:@//oracle:1521/FREEPDB1
      DB_USER: ihale
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD tanımlanmalı}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET en az 32 karakter olmalı}
      DEMO_SIFRE: ${DEMO_SIFRE:?DEMO_SIFRE tanımlanmalı}
    ports:
      - "8080:8080"
